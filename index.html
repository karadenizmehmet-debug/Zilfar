```html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Okul Zil & Anons Sistemi</title>
    <!-- Tailwind CSS (Tasarım için) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome (İkonlar için) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans">
    
    <div id="app"></div>

    <script type="module">
        // Firebase kütüphanelerini doğrudan tarayıcıya çekiyoruz
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Sizin Firebase Ayarlarınız
        const firebaseConfig = {
            apiKey: "AIzaSyAaWmtycFbkjfYj242K5dqvCmfB6XM0ZdY",
            authDomain: "zil-far.firebaseapp.com",
            databaseURL: "https://zil-far-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "zil-far",
            storageBucket: "zil-far.firebasestorage.app",
            messagingSenderId: "245735942145",
            appId: "1:245735942145:web:6a1854cf3baf454a707800"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const appId = 'okul-zil-app';
        const SCHOOLS = ["Okul 1", "Okul 2", "Okul 3"];

        let currentUser = null;
        let currentProfile = null;
        let allProfiles = [];
        let commands = [];
        let adminEmailConfig = 'karadenizmehmet@gmail.com'; 
        
        const appDiv = document.getElementById('app');

        // Oturum durumunu dinle
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await fetchOrCreateProfile(user);
                listenToData();
            } else {
                currentUser = null;
                currentProfile = null;
                render();
            }
        });

        async function fetchOrCreateProfile(user) {
            const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', user.uid);
            const snap = await getDoc(profileRef);
            const isAdmin = user.email.toLowerCase() === adminEmailConfig.toLowerCase();

            if (snap.exists()) {
                let data = snap.data();
                if (isAdmin && data.role !== 'admin') {
                    await updateDoc(profileRef, { role: 'admin', status: 'approved' });
                    data.role = 'admin';
                    data.status = 'approved';
                }
                currentProfile = { id: snap.id, ...data };
            } else {
                const newProfile = {
                    email: user.email,
                    displayName: user.displayName || user.email.split('@')[0],
                    status: isAdmin ? 'approved' : 'pending',
                    role: isAdmin ? 'admin' : 'user',
                    school: null,
                    createdAt: Date.now()
                };
                await setDoc(profileRef, newProfile);
                currentProfile = { id: user.uid, ...newProfile };
            }
            render();
        }

        function listenToData() {
            if (!currentProfile) return;
            
            if (currentProfile.role === 'admin') {
                const profilesRef = collection(db, 'artifacts', appId, 'public', 'data', 'profiles');
                onSnapshot(profilesRef, (snapshot) => {
                    allProfiles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    allProfiles.sort((a, b) => b.createdAt - a.createdAt);
                    render();
                });
            }

            const commandsRef = collection(db, 'artifacts', appId, 'public', 'data', 'commands');
            onSnapshot(commandsRef, (snapshot) => {
                commands = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                commands.sort((a, b) => b.timestamp - a.timestamp);
                commands = commands.slice(0, 20);
                render();
            });
        }

        window.handleGoogleLogin = async () => {
            const emailInput = document.getElementById('adminEmailInput');
            if(emailInput) adminEmailConfig = emailInput.value;
            
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Giriş Hatası: " + error.message);
            }
        };

        window.handleLogout = async () => { 
            await signOut(auth); 
        };

        window.approveUser = async (userId) => {
            const selectEl = document.getElementById('school-select-' + userId);
            if (!selectEl.value) return showMessage("Lütfen önce bir okul seçin!");
            
            const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', userId);
            await updateDoc(userRef, { status: 'approved', school: selectEl.value });
            showMessage(selectEl.value + " yetkisi verildi!");
        };

        window.revokeUser = async (userId) => {
            const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', userId);
            await updateDoc(userRef, { status: 'pending', school: null });
            showMessage("Kullanıcı yetkisi iptal edildi!");
        };

        window.sendPlayCommand = async () => {
            if (!currentProfile || !currentProfile.school) return;
            const cmdRef = collection(db, 'artifacts', appId, 'public', 'data', 'commands');
            await addDoc(cmdRef, {
                command: 'PLAY_ANTHEM',
                school: currentProfile.school,
                triggeredBy: currentProfile.email,
                timestamp: Date.now()
            });
            showMessage("Komut Gönderildi: " + currentProfile.school);
        };

        function showMessage(msg) {
            const msgDiv = document.createElement('div');
            msgDiv.className = "fixed top-4 right-4 bg-slate-800 text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-2 animate-bounce";
            msgDiv.innerHTML = `<i class="fas fa-check-circle text-green-400"></i> ${msg}`;
            document.body.appendChild(msgDiv);
            setTimeout(() => msgDiv.remove(), 3000);
        }

        // HTML Arayüzü Çizimi
        function render() {
            if (!currentUser) {
                appDiv.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100">
                        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full space-y-6 text-center">
                            <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                                <i class="fas fa-broadcast-tower text-2xl text-blue-600"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-gray-800">Okul Zil Sistemi</h1>
                            <p class="text-gray-500 text-sm mt-2 mb-6">Sisteme erişmek için giriş yapın</p>

                            <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 text-left mb-4">
                                <label class="block text-slate-700 text-sm font-bold mb-1">Yönetici E-postası:</label>
                                <input type="email" id="adminEmailInput" value="${adminEmailConfig}" class="w-full p-2 border border-slate-300 rounded outline-none focus:border-blue-500 text-sm">
                                <p class="text-xs text-slate-500 mt-2">* Bu mail ile giriş yapan hesap otomatik Yönetici (Admin) olur.</p>
                            </div>
                            
                            <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-200 text-slate-700 font-bold py-3 px-4 rounded-lg hover:bg-slate-50 transition-colors shadow-sm">
                                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                                Google İle Giriş Yap
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            if (!currentProfile) {
                 appDiv.innerHTML = `<div class="min-h-screen flex items-center justify-center"><i class="fas fa-circle-notch fa-spin text-4xl text-blue-600"></i></div>`;
                 return;
            }

            let headerHtml = `
                <header class="bg-white shadow-sm border-b border-slate-200 px-4 py-4 flex items-center justify-between sticky top-0 z-10">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-broadcast-tower text-xl text-blue-600"></i>
                        <h1 class="font-bold text-lg hidden sm:block">Merkezi Anons Sistemi</h1>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex flex-col items-end">
                            <span class="text-sm font-bold">${currentProfile.displayName}</span>
                            <span class="text-xs text-slate-500">${currentProfile.role === 'admin' ? 'Yönetici' : (currentProfile.school || 'Beklemede')}</span>
                        </div>
                        <button onclick="handleLogout()" class="p-2 text-slate-500 hover:bg-slate-100 rounded-full" title="Çıkış Yap"><i class="fas fa-sign-out-alt text-lg"></i></button>
                    </div>
                </header>
            `;

            let mainHtml = '<main class="max-w-6xl mx-auto p-4 space-y-6">';

            if (currentProfile.role === 'admin') {
                let rows = allProfiles.filter(p => p.email !== currentProfile.email).map(p => `
                    <tr class="border-b border-slate-100 text-sm">
                        <td class="py-4 font-medium">${p.displayName}<br><span class="text-xs text-slate-400 font-normal">${p.email}</span></td>
                        <td class="py-4">
                            ${p.status === 'approved' 
                                ? '<span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold whitespace-nowrap"><i class="fas fa-check"></i> Onaylı</span>' 
                                : '<span class="px-2 py-1 bg-amber-100 text-amber-700 rounded-full text-xs font-bold whitespace-nowrap"><i class="fas fa-clock"></i> Bekliyor</span>'}
                        </td>
                        <td class="py-4">
                            <select id="school-select-${p.id}" class="border border-slate-300 rounded p-2 text-sm outline-none bg-white w-full max-w-[150px]">
                                <option value="" disabled ${!p.school ? 'selected' : ''}>Okul Seç</option>
                                ${SCHOOLS.map(s => `<option value="${s}" ${p.school === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </td>
                        <td class="py-4 text-right">
                            ${p.status === 'pending'
                                ? `<button onclick="approveUser('${p.id}')" class="bg-blue-600 text-white px-4 py-2 rounded text-xs font-bold shadow-sm w-full lg:w-auto mb-1">Yetki Ver</button>`
                                : `<button onclick="revokeUser('${p.id}')" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded text-xs font-bold w-full lg:w-auto">İptal</button>`}
                        </td>
                    </tr>
                `).join('');

                mainHtml += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex items-center gap-2">
                            <i class="fas fa-users text-slate-600"></i><h2 class="font-bold text-lg">Kullanıcı Yetkilendirme Paneli</h2>
                        </div>
                        <div class="p-6 overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[500px]">
                                <thead><tr class="border-b border-slate-200 text-sm text-slate-500"><th class="pb-3">Kullanıcı</th><th class="pb-3">Durum</th><th class="pb-3">Okul</th><th class="pb-3 text-right">İşlem</th></tr></thead>
                                <tbody>${rows.length > 0 ? rows : '<tr><td colspan="4" class="py-8 text-center text-slate-500">Sisteme henüz başka kimse kayıt olmamış.</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            if (currentProfile.role === 'user' && currentProfile.status === 'pending') {
                mainHtml += `
                    <div class="bg-amber-50 border border-amber-200 rounded-xl p-8 text-center mt-6 max-w-2xl mx-auto">
                        <i class="fas fa-clock text-6xl text-amber-500 mb-4"></i>
                        <h2 class="text-2xl font-bold text-amber-800">Onay Bekleniyor</h2>
                        <p class="text-amber-700 mt-2 text-lg">Yöneticiniz sizi onaylayıp bir okula atadığında bu ekranda anons butonu belirecektir.</p>
                    </div>
                `;
            }

            if (currentProfile.status === 'approved') {
                let logRows = commands.map(cmd => `
                    <div class="bg-slate-800 p-3 rounded border border-slate-700 text-xs text-slate-300 mb-2">
                        <div class="flex justify-between mb-1"><span class="text-green-400 font-bold">[${new Date(cmd.timestamp).toLocaleTimeString()}]</span><span class="bg-blue-900 text-blue-300 px-2 py-0.5 rounded">${cmd.school}</span></div>
                        <div class="text-yellow-400 font-bold text-sm">${cmd.command}</div>
                        <div class="text-slate-500 mt-1 truncate">Kim: ${cmd.triggeredBy}</div>
                    </div>
                `).join('');

                let controlPanelHtml = '';
                if (currentProfile.role === 'admin' && !currentProfile.school) {
                    controlPanelHtml = `
                        <div class="text-center p-6 bg-slate-50 rounded-lg w-full border border-slate-200">
                            <i class="fas fa-exclamation-triangle text-4xl text-amber-500 mb-3"></i>
                            <p class="text-slate-600 font-medium">Yönetici hesabı komut gönderemez, sadece kullanıcıları yönetir.<br><br>Komut göndermeyi test etmek için gizli sekmeden farklı bir Google hesabıyla giriş yapabilirsiniz.</p>
                        </div>
                    `;
                } else {
                    controlPanelHtml = `
                        <h2 class="text-2xl font-bold text-slate-800 mb-2">Anons Paneli</h2>
                        <p class="text-slate-500 text-lg mb-8">Yetkili Okul: <strong class="text-blue-600">${currentProfile.school}</strong></p>
                        <button onclick="sendPlayCommand()" class="relative group bg-red-600 hover:bg-red-700 text-white rounded-full w-56 h-56 flex flex-col items-center justify-center shadow-[0_10px_20px_rgba(220,38,38,0.3)] transition-transform active:scale-95 mx-auto">
                            <i class="fas fa-play text-6xl mb-4 ml-2"></i>
                            <span class="font-bold text-xl leading-tight uppercase text-center tracking-wide">İstiklal<br>Marşı</span>
                        </button>
                        <p class="mt-6 text-slate-400 text-sm">Butona bastığınızda komut veritabanına iletilecektir.</p>
                    `;
                }

                mainHtml += `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-4">
                        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 flex flex-col items-center justify-center min-h-[400px] text-center">${controlPanelHtml}</div>
                        
                        <div class="bg-slate-900 rounded-xl shadow-sm border border-slate-800 flex flex-col h-[400px]">
                            <div class="bg-slate-950 px-6 py-4 flex items-center gap-2 border-b border-slate-800">
                                <i class="fas fa-satellite-dish text-green-400 animate-pulse"></i><h3 class="font-bold text-white text-lg">Sistem Logları</h3>
                            </div>
                            <div class="p-4 flex-1 overflow-y-auto font-mono">${logRows || '<div class="text-slate-500 text-center py-8">Henüz komut yok...</div>'}</div>
                        </div>
                    </div>
                `;
            }

            mainHtml += '</main>';
            appDiv.innerHTML = headerHtml + mainHtml;
        }

        render();
    </script>
</body>
</html>
```
