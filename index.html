<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İstiklal Marşı Sistemi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans relative min-h-screen pb-10">
    
    <div id="app"></div>

    <!-- Mehmet Karadeniz İmzası -->
    <div class="fixed bottom-2 right-3 text-[11px] text-slate-500 font-medium bg-white/80 px-3 py-1.5 rounded-full backdrop-blur-sm border border-slate-200 shadow-sm z-50">
        <i class="fas fa-code text-red-500 mr-1"></i> Mehmet Karadeniz tarafından yapılmıştır
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, onSnapshot, addDoc, query, orderBy, limit, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getDatabase, ref as rtdbRef, set as rtdbSet } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAaWmtycFbkjfYj242K5dqvCmfB6XM0ZdY",
            authDomain: "zil-far.firebaseapp.com",
            projectId: "zil-far",
            storageBucket: "zil-far.firebasestorage.app",
            messagingSenderId: "245735942145",
            appId: "1:245735942145:web:6a1854cf3baf454a707800"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const rtdb = getDatabase(app, "https://zil-far-default-rtdb.europe-west1.firebasedatabase.app");
        
        const appId = 'okul-zil-app';
        const SCHOOLS = [
            "Karahüyük Ali Akkanat Ortaokulu",
            "Nimetullah Nahçivani İmam Hatip Ortaokulu",
            "Şehit Coşkun Karabulut İmam Hatip Ortaokulu"
        ];

        // Python alıcısının dinlediği RTDB okul anahtarlarıyla birebir aynı olmalı.
        const SCHOOL_KEYS = {
            "Karahüyük Ali Akkanat Ortaokulu": "karahuyuk_ali_akkanat",
            "Nimetullah Nahçivani İmam Hatip Ortaokulu": "nimetullah_nahcivani",
            "Şehit Coşkun Karabulut İmam Hatip Ortaokulu": "sehit_coskun_karabulut"
        };

        let currentUser = null;
        let currentProfile = null;
        let allProfiles = [];
        let commands = [];
        let authInitializing = true; 
        let activeTab = 'play';
        
        let unsubMyProfile = null;
        let unsubAllProfiles = null;
        let unsubCommands = null;
        
        const appDiv = document.getElementById('app');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await setupMyProfileListener(user);
            } else {
                cleanupListeners();
                currentUser = null;
                currentProfile = null;
                authInitializing = false;
                render();
            }
        });

        function cleanupListeners() {
            if (unsubMyProfile) { unsubMyProfile(); unsubMyProfile = null; }
            if (unsubAllProfiles) { unsubAllProfiles(); unsubAllProfiles = null; }
            if (unsubCommands) { unsubCommands(); unsubCommands = null; }
        }

        async function setupMyProfileListener(user) {
            const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', user.uid);
            
            try {
                const snap = await getDoc(profileRef);
                const isAdmin = user.email.toLowerCase() === 'karadenizmehmet@gmail.com';

                if (!snap.exists()) {
                    const newProfile = {
                        email: user.email,
                        displayName: user.displayName || user.email.split('@')[0],
                        status: isAdmin ? 'approved' : 'pending',
                        role: isAdmin ? 'admin' : 'user',
                        school: null,
                        createdAt: Date.now()
                    };
                    await setDoc(profileRef, newProfile);
                }

                if (unsubMyProfile) unsubMyProfile();
                unsubMyProfile = onSnapshot(profileRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const oldProfile = currentProfile ? { ...currentProfile } : null;
                        currentProfile = { id: docSnap.id, ...docSnap.data() };
                        
                        // Sadece rol, okul veya durum değiştiğinde verileri yeniden dinle
                        if (!oldProfile || oldProfile.role !== currentProfile.role || oldProfile.status !== currentProfile.status || oldProfile.school !== currentProfile.school) {
                            setupDataListeners();
                        }
                        
                        authInitializing = false;
                        render();
                        
                        if (oldProfile && oldProfile.status === 'approved' && currentProfile.status === 'pending') {
                            showMessage("Yetkiniz yönetici tarafından iptal edildi.", "warning");
                        }
                    }
                }, (error) => {
                    console.error("Profil dinleme hatası:", error);
                    showMessage("Profilinize erişilemedi. Yetkiniz kısıtlanmış olabilir.", "error");
                    authInitializing = false;
                    render();
                });

            } catch (error) {
                console.error("Sisteme bağlanırken hata:", error);
                showMessage("Sistem bağlantı hatası.", "error");
                authInitializing = false;
                render();
            }
        }

        function setupDataListeners() {
            if (!currentProfile) return;
            
            // Profiller Dinleyicisi (Sadece Admin)
            if (currentProfile.role === 'admin') {
                if (!unsubAllProfiles) {
                    const profilesRef = collection(db, 'artifacts', appId, 'public', 'data', 'profiles');
                    unsubAllProfiles = onSnapshot(profilesRef, (snapshot) => {
                        allProfiles = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        allProfiles.sort((a, b) => b.createdAt - a.createdAt);
                        render();
                    }, (error) => console.error("Kullanıcı listesi erişim hatası (Kurallar engellemiş olabilir):", error));
                }
            } else {
                if (unsubAllProfiles) { unsubAllProfiles(); unsubAllProfiles = null; }
            }

            // Komutlar Dinleyicisi
            if (currentProfile.status === 'approved') {
                if (unsubCommands) unsubCommands();
                
                const commandsRef = collection(db, 'artifacts', appId, 'public', 'data', 'commands');
                let q;

                if (currentProfile.role === 'admin') {
                    q = query(commandsRef, orderBy('timestamp', 'desc'), limit(30));
                } else if (currentProfile.school) {
                    q = query(commandsRef, where('school', '==', currentProfile.school), orderBy('timestamp', 'desc'), limit(30));
                } else {
                    return; // Onaylı ama okulu yoksa dinleme
                }
                
                unsubCommands = onSnapshot(q, (snapshot) => {
                    commands = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    render();
                }, (error) => {
                    console.error("Komut dinleme hatası:", error);
                    if(error.message.includes("index")) {
                        showMessage("Veritabanı indeksi gerekiyor. Lütfen konsolu kontrol edin.", "error");
                    }
                });
            } else {
                if (unsubCommands) { unsubCommands(); unsubCommands = null; }
                commands = [];
            }
        }

        window.handleGoogleLogin = async () => {
            const provider = new GoogleAuthProvider();
            provider.setCustomParameters({ prompt: 'select_account' });
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Giriş Hatası:", error);
                showMessage("Giriş başarısız: " + error.message, "error");
            }
        };

        window.handleLogout = async () => { 
            authInitializing = true;
            render();
            cleanupListeners();
            await signOut(auth); 
        };

        window.approveUser = async (userId) => {
            const selectEl = document.getElementById('school-select-' + userId);
            if (!selectEl.value) return showMessage("Lütfen önce bir okul seçin!", "error");
            try {
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', userId);
                await updateDoc(userRef, { status: 'approved', school: selectEl.value });
                showMessage("Kullanıcıya yetki verildi!");
            } catch (err) {
                console.error(err);
                showMessage("Hata: Yetki verilemedi. Kuralları kontrol edin.", "error");
            }
        };

        window.changeSchool = async (userId) => {
            const selectEl = document.getElementById('school-select-' + userId);
            if (!selectEl.value) return showMessage("Lütfen bir okul seçin!", "error");
            try {
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', userId);
                await updateDoc(userRef, { school: selectEl.value });
                showMessage("Kullanıcının okulu başarıyla güncellendi!");
            } catch (err) {
                console.error(err);
                showMessage("Okul güncellenemedi.", "error");
            }
        };

        window.revokeUser = async (userId) => {
            if(userId === currentUser.uid) return showMessage("Kendi yetkinizi iptal edemezsiniz!", "error");
            if(!confirm("Bu kullanıcının yetkisini tamamen iptal etmek istediğinize emin misiniz?")) return;
            
            try {
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'profiles', userId);
                await updateDoc(userRef, { status: 'pending', school: null });
                showMessage("Kullanıcı yetkisi iptal edildi!", "warning");
            } catch (err) {
                console.error(err);
                showMessage("Yetki iptal edilemedi.", "error");
            }
        };

        window.sendPlayCommand = async () => {
            let targetSchool = currentProfile.school;
            
            if (currentProfile.role === 'admin') {
                const selectEl = document.getElementById('admin-school-select');
                if (!selectEl || !selectEl.value) {
                    return showMessage("Lütfen anons yapmak istediğiniz okulu seçin!", "error");
                }
                targetSchool = selectEl.value;
            }

            if (!targetSchool || currentProfile.status !== 'approved') {
                return showMessage("Yetkiniz bulunmuyor veya okul seçilmedi.", "error");
            }

            try {
                const schoolKey = SCHOOL_KEYS[targetSchool];
                if (!schoolKey) throw new Error("Bu okul için Python alıcı anahtarı tanımlanmamış.");

                // Python alıcısının kontrol ettiği Realtime Database yolu.
                const commandId = (crypto.randomUUID ? crypto.randomUUID() : (Date.now() + "_" + Math.random().toString(16).slice(2)));
                await rtdbSet(rtdbRef(rtdb, `okullar/${schoolKey}/istiklal_komutu`), {
                    id: commandId,
                    komut: "istiklal",
                    timestamp: Date.now()
                });

                // Mevcut arayüzdeki Sistem Logları için Firestore kaydı da korunur.
                const cmdRef = collection(db, 'artifacts', appId, 'public', 'data', 'commands');
                await addDoc(cmdRef, {
                    command: 'PLAY_ANTHEM',
                    school: targetSchool,
                    triggeredBy: currentProfile.displayName || currentUser.email || "Yetkili",
                    timestamp: Date.now(),
                    rtdbCommandId: commandId
                });
                showMessage(targetSchool + " için Marş Komutu Gönderildi!");
            } catch (err) {
                console.error("Komut gönderme hatası:", err);
                showMessage("Komut gönderilemedi. Firebase kurallarını ve bağlantıyı kontrol edin.", "error");
            }
        };

        window.switchTab = (tabName) => {
            activeTab = tabName;
            render();
        };

        function showMessage(msg, type="success") {
            const existing = document.getElementById('toast-msg');
            if (existing) existing.remove();

            const msgDiv = document.createElement('div');
            msgDiv.id = 'toast-msg';
            const colorClass = type === "error" ? "bg-red-600" : (type === "warning" ? "bg-amber-600" : "bg-slate-800");
            const iconClass = type === "error" ? "fa-exclamation-triangle" : (type === "warning" ? "fa-exclamation-circle" : "fa-check-circle");
            const textIconClass = type === "success" ? "text-green-400" : "text-white";

            msgDiv.className = `fixed top-4 right-4 ${colorClass} text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-2 animate-bounce`;
            msgDiv.innerHTML = `<i class="fas ${iconClass} ${textIconClass}"></i> ${msg}`;
            document.body.appendChild(msgDiv);
            setTimeout(() => { if (msgDiv.parentNode) msgDiv.remove(); }, 3500);
        }

        function render() {
            if (authInitializing) {
                appDiv.innerHTML = `
                    <div class="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-100">
                        <i class="fas fa-circle-notch fa-spin text-5xl text-red-600 mb-4"></i>
                        <p class="text-slate-500 font-medium">Sistem Yükleniyor...</p>
                    </div>
                `;
                return;
            }

            if (!currentUser) {
                appDiv.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4 bg-slate-100">
                        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full space-y-6 text-center border-t-4 border-red-600">
                            <div class="w-full h-32 mx-auto mb-4 overflow-hidden border border-slate-200 shadow-sm rounded flex items-center justify-center bg-white">
                                <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg" class="w-full h-full object-cover" alt="Türk Bayrağı">
                            </div>
                            <h1 class="text-3xl font-bold text-gray-800 tracking-tight">İstiklal Marşı Sistemi</h1>
                            <p class="text-gray-500 text-sm mt-2 mb-6">Sisteme erişmek için giriş yapın</p>
                            
                            <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-200 text-slate-700 font-bold py-3 px-4 rounded-lg hover:bg-slate-50 transition-colors shadow-sm">
                                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                                Google İle Giriş Yap
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            let headerHtml = `
                <header class="bg-white shadow-sm border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-10">
                    <div class="flex items-center gap-3">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Flag_of_Turkey.svg" class="w-10 h-7 object-cover rounded shadow-sm border border-slate-200" alt="Türk Bayrağı">
                        <h1 class="font-bold text-lg hidden sm:block text-slate-800">İstiklal Marşı Sistemi</h1>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="flex flex-col items-end">
                            <span class="text-sm font-bold text-slate-800">Hoş geldin, ${currentProfile.displayName}</span>
                            <span class="text-xs text-slate-500">${currentProfile.role === 'admin' ? 'Yönetici' : (currentProfile.school || 'Beklemede')}</span>
                        </div>
                        <button onclick="handleLogout()" class="p-2 text-slate-500 hover:bg-red-50 hover:text-red-500 rounded-full transition-colors" title="Çıkış Yap">
                            <i class="fas fa-sign-out-alt text-lg"></i>
                        </button>
                    </div>
                </header>
            `;

            let mainHtml = '<main class="max-w-4xl mx-auto p-4">';

            if (currentProfile.role === 'user' && currentProfile.status === 'pending') {
                mainHtml += `
                    <div class="bg-amber-50 border border-amber-200 rounded-xl p-8 text-center mt-6 max-w-2xl mx-auto">
                        <i class="fas fa-clock text-6xl text-amber-500 mb-4 animate-pulse"></i>
                        <h2 class="text-2xl font-bold text-amber-800">Onay Bekleniyor</h2>
                        <p class="text-amber-700 mt-2 text-lg">Yöneticiniz sizi onaylayıp bir okula atadığında sisteme erişiminiz açılacaktır.</p>
                    </div>
                </main>
                `;
                appDiv.innerHTML = headerHtml + mainHtml;
                return;
            }

            // Menü Sekmeleri
            mainHtml += `
                <div class="bg-white rounded-t-xl border-b border-slate-200 flex overflow-x-auto shadow-sm mb-6 mt-2">
                    <button onclick="switchTab('play')" class="flex-1 py-3 px-4 font-semibold text-sm transition-colors ${activeTab === 'play' ? 'border-b-2 border-red-600 text-red-600 bg-red-50/50' : 'text-slate-600 hover:bg-slate-50'} whitespace-nowrap">
                        <i class="fas fa-play-circle mr-2"></i>Anons Paneli
                    </button>
                    ${currentProfile.role === 'admin' ? `
                    <button onclick="switchTab('users')" class="flex-1 py-3 px-4 font-semibold text-sm transition-colors ${activeTab === 'users' ? 'border-b-2 border-red-600 text-red-600 bg-red-50/50' : 'text-slate-600 hover:bg-slate-50'} whitespace-nowrap">
                        <i class="fas fa-users-cog mr-2"></i>Yetkilendirme
                    </button>
                    ` : ''}
                    <button onclick="switchTab('logs')" class="flex-1 py-3 px-4 font-semibold text-sm transition-colors ${activeTab === 'logs' ? 'border-b-2 border-red-600 text-red-600 bg-red-50/50' : 'text-slate-600 hover:bg-slate-50'} whitespace-nowrap">
                        <i class="fas fa-list-alt mr-2"></i>Sistem Logları
                    </button>
                </div>
            `;

            // SEKMELERİN İÇERİĞİ
            if (activeTab === 'play') {
                let controlPanelHtml = '';
                if (currentProfile.role === 'admin') {
                    controlPanelHtml = `
                        <h2 class="text-2xl font-bold text-slate-800 mb-2 z-10 relative">Yönetici Anons Paneli</h2>
                        <p class="text-slate-500 text-sm mb-8 text-center z-10 relative">İstiklal Marşı'nı çalmak istediğiniz okulu seçin.</p>
                        
                        <div class="w-full max-w-md mx-auto mb-10 z-10 relative">
                            <select id="admin-school-select" class="w-full border-2 border-slate-300 rounded-lg p-3 text-sm outline-none focus:border-red-500 bg-white font-medium text-slate-700 shadow-sm">
                                <option value="" disabled selected>Hedef Okul Seçiniz...</option>
                                ${SCHOOLS.map(s => `<option value="${s}">${s}</option>`).join('')}
                            </select>
                        </div>

                        <button onclick="sendPlayCommand()" class="z-10 relative group bg-red-600 hover:bg-red-700 text-white rounded-full w-48 h-48 sm:w-64 sm:h-64 flex flex-col items-center justify-center shadow-[0_10px_20px_rgba(220,38,38,0.3)] hover:shadow-[0_15px_30px_rgba(220,38,38,0.5)] transition-all active:scale-95 mx-auto">
                            <i class="fas fa-play text-5xl sm:text-7xl mb-4 ml-2"></i>
                            <span class="font-bold text-xl sm:text-2xl leading-tight uppercase text-center tracking-wide">İstiklal<br>Marşı</span>
                        </button>
                    `;
                } else {
                    controlPanelHtml = `
                        <h2 class="text-2xl font-bold text-slate-800 mb-2 z-10 relative">Anons Paneli</h2>
                        <div class="bg-red-50 border border-red-100 rounded-lg p-3 mb-10 z-10 relative inline-block">
                            <p class="text-slate-600 text-sm">Yetkili Okul: <strong class="text-red-700 block text-base">${currentProfile.school}</strong></p>
                        </div>
                        <button onclick="sendPlayCommand()" class="z-10 relative group bg-red-600 hover:bg-red-700 text-white rounded-full w-48 h-48 sm:w-64 sm:h-64 flex flex-col items-center justify-center shadow-[0_10px_20px_rgba(220,38,38,0.3)] hover:shadow-[0_15px_30px_rgba(220,38,38,0.5)] transition-all active:scale-95 mx-auto">
                            <i class="fas fa-play text-5xl sm:text-7xl mb-4 ml-2"></i>
                            <span class="font-bold text-xl sm:text-2xl leading-tight uppercase text-center tracking-wide">İstiklal<br>Marşı</span>
                        </button>
                    `;
                }

                mainHtml += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 flex flex-col items-center justify-center min-h-[500px] text-center relative overflow-hidden">
                        <div class="absolute -bottom-16 -right-16 opacity-[0.03] pointer-events-none">
                            <i class="fas fa-star-and-crescent text-[300px]"></i>
                        </div>
                        ${controlPanelHtml}
                    </div>
                `;
            } 
            else if (activeTab === 'users' && currentProfile.role === 'admin') {
                let rows = allProfiles.filter(p => p.email !== currentProfile.email).map(p => `
                    <tr class="border-b border-slate-100 text-sm flex flex-col lg:table-row py-4 lg:py-0">
                        <td class="py-2 lg:py-4 font-medium">${p.displayName}<br><span class="text-xs text-slate-400 font-normal">${p.email}</span></td>
                        <td class="py-2 lg:py-4">
                            ${p.status === 'approved' 
                                ? '<span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs font-bold whitespace-nowrap"><i class="fas fa-check"></i> Onaylı</span>' 
                                : '<span class="px-2 py-1 bg-amber-100 text-amber-700 rounded-full text-xs font-bold whitespace-nowrap"><i class="fas fa-clock"></i> Bekliyor</span>'}
                        </td>
                        <td class="py-2 lg:py-4">
                            <select id="school-select-${p.id}" class="border border-slate-300 rounded p-2 text-xs outline-none bg-white w-full focus:border-red-500">
                                <option value="" disabled ${!p.school ? 'selected' : ''}>Okul Seç</option>
                                ${SCHOOLS.map(s => `<option value="${s}" ${p.school === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                        </td>
                        <td class="py-2 lg:py-4 lg:text-right">
                            <div class="flex items-center gap-2 lg:justify-end mt-2 lg:mt-0">
                                ${p.status === 'pending'
                                    ? `<button onclick="approveUser('${p.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs font-bold shadow-sm w-full lg:w-auto transition-colors">Yetki Ver</button>`
                                    : `<button onclick="changeSchool('${p.id}')" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded text-xs font-bold shadow-sm w-full lg:w-auto transition-colors">Değiştir</button>
                                       <button onclick="revokeUser('${p.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 px-3 py-1.5 rounded text-xs font-bold w-full lg:w-auto transition-colors">İptal Et</button>`}
                            </div>
                        </td>
                    </tr>
                `).join('');

                mainHtml += `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-50 border-b border-slate-200 px-6 py-4 flex items-center gap-2">
                            <i class="fas fa-users text-slate-600"></i><h2 class="font-bold text-lg text-slate-800">Sistem Kullanıcıları</h2>
                        </div>
                        <div class="p-4 lg:p-6 overflow-x-auto min-h-[400px]">
                            <table class="w-full text-left border-collapse">
                                <thead class="hidden lg:table-header-group"><tr class="border-b border-slate-200 text-sm text-slate-500"><th class="pb-3">Kullanıcı</th><th class="pb-3">Durum</th><th class="pb-3 w-1/3">Okul</th><th class="pb-3 text-right">İşlem</th></tr></thead>
                                <tbody class="divide-y divide-slate-100 lg:divide-y-0">${rows.length > 0 ? rows : '<tr><td colspan="4" class="py-8 text-center text-slate-500">Sisteme henüz başka kimse kayıt olmamış.</td></tr>'}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            } 
            else if (activeTab === 'logs') {
                let logRows = commands.map(cmd => `
                    <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 text-sm text-slate-300 mb-3 shadow-sm">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-2 gap-2">
                            <span class="text-green-400 font-bold whitespace-nowrap"><i class="fas fa-clock mr-1"></i> ${new Date(cmd.timestamp).toLocaleTimeString()} - ${new Date(cmd.timestamp).toLocaleDateString()}</span>
                            <span class="bg-blue-900/50 border border-blue-800 text-blue-300 px-2 py-1 rounded text-xs font-medium">${cmd.school}</span>
                        </div>
                        <div class="text-yellow-400 font-bold text-base mb-1 border-b border-slate-700 pb-2"><i class="fas fa-volume-up mr-2"></i>${cmd.command === 'PLAY_ANTHEM' ? 'İstiklal Marşı Çalma İsteği' : cmd.command}</div>
                        <div class="text-slate-400 mt-2">Çalan Yetkili: <span class="text-white font-medium bg-slate-700 px-2 py-0.5 rounded ml-1">${cmd.triggeredBy}</span></div>
                    </div>
                `).join('');

                mainHtml += `
                    <div class="bg-slate-900 rounded-xl shadow-sm border border-slate-800 flex flex-col h-[600px]">
                        <div class="bg-slate-950 px-6 py-4 flex items-center gap-2 border-b border-slate-800 rounded-t-xl">
                            <i class="fas fa-satellite-dish text-green-400 animate-pulse"></i>
                            <h3 class="font-bold text-white text-lg">Canlı Sistem Logları ${currentProfile.role !== 'admin' ? '(Sadece Okulunuz)' : ''}</h3>
                        </div>
                        <div class="p-4 flex-1 overflow-y-auto font-mono bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                            ${logRows || '<div class="text-slate-500 text-center py-8 flex flex-col items-center"><i class="fas fa-history text-4xl mb-3 opacity-50"></i>Gösterilecek kayıt bulunamadı.</div>'}
                        </div>
                    </div>
                `;
            }

            mainHtml += '</main>';
            appDiv.innerHTML = headerHtml + mainHtml;
        }

        render();
    </script>
</body>
</html>
